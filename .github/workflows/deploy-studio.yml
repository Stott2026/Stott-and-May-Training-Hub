# Publishes the hosted Sanity Studio (https://stottandmay-training.sanity.studio) automatically,
# so nobody needs the project on their own computer to run `npm run studio:deploy`.
#
# It runs when anything in studio/ changes on the live branch, and by hand from GitHub:
# Actions → Deploy the Studio → Run workflow.
#
# Needs one repository secret, SANITY_AUTH_TOKEN: a Sanity API token with the "Deploy Studio"
# permission (sanity.io/manage → the project → API → Tokens). Set in GitHub under
# Settings → Secrets and variables → Actions.
name: Deploy the Studio

on:
  push:
    branches: [claude/training-hub-platform-a9e704]
    paths: ["studio/**"]
  workflow_dispatch:

# Only one deploy at a time. A run that's already publishing always finishes; a newer one waits
# its turn (and replaces any other run still waiting), so the Studio is never stopped part-way.
concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANITY_STUDIO_PROJECT_ID: hhtep62l
      SANITY_STUDIO_DATASET: production
      SANITY_STUDIO_HOSTNAME: stottandmay-training
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the token is set
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::The SANITY_AUTH_TOKEN secret isn't set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Install
        run: npm ci --workspace studio --include-workspace-root
      - name: Build and publish the Studio
        working-directory: studio
        run: npx sanity deploy --yes

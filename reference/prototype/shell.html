<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stott and May Training Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111314;--field:#242b32;--ink:#FFFFFF;--ink-2:#c3ccd6;--label:#9aa6b4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#111314}}
:root[data-theme="dark"]{--bg:#111314}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#6b7684}
:focus-visible{outline:2px solid #73F7BB;outline-offset:2px}
.topnav{background:#181c20;border-bottom:1px solid #2a2f35;padding:0 1.25rem;display:flex;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;overflow-x:auto}
.fab{bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))}
.mod-card,.doc-card,.res{transition:border-color .15s,transform .15s}
.mod-card:hover,.doc-card:hover,.res:hover{border-color:#00C8C8 !important}
.btn-ghost{background:transparent;border:1px solid #2a2f35;border-radius:8px;padding:8px 14px;color:#c3ccd6;font-size:12px;cursor:pointer;font-weight:600}
.btn-ghost:hover{border-color:#00C8C8;color:#00C8C8}
.btn-solid{background:linear-gradient(135deg,#00C8C8,#73F7BB);border:none;border-radius:8px;padding:8px 14px;color:#111314;font-size:12px;font-weight:700;cursor:pointer}
textarea:focus,input:focus{border-color:#00C8C8 !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important;scroll-behavior:auto !important}}
@media print{
  :root{--bg:#fff;--field:#fff;--ink:#111314;--ink-2:#333;--label:#4a5563;padding:0}
  body{background:#fff}
  .no-print{display:none !important}
  .print-sheet{background:#fff !important;border:none !important;padding:0 !important}
  .print-sheet input,.print-sheet textarea,.print-sheet button{border-color:#bfc7cf !important;color:#111 !important}
  .print-sheet textarea{resize:none}
  @page{margin:14mm}
}
</style>
</head>
<body><div id="root"></div>
<script>/*__BUNDLE__*/</script>
</body></html>
